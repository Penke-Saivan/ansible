---
- name: functions or filters
  hosts: local
  connection: local
  vars:
    placeholder: holder
    technologies: DevOps, Linux, Shell, Ansible
    technologies_hyphen: DevOps - Linux - Shell - Ansible
    test1: test1
    tags:
      Application: payment
      Environment: dev
    listTags:
    - key: Application
      value: payment
    - key: Environment
      value: dev  
  tasks:
  - name: default variable when value is not provided
    ansible.builtin.debug:
      msg: "Hello, {{ name }}"
    ignore_errors: true  

